name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hub:
    uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-ci.yml@v0
    with:
      app_id: cameras
      go2rtc: true
      # The image job builds the real app image (bdh-sdk builder/) and runs
      # it hardened like the supervisor. NVRs live in app state (Settings ->
      # NVRs) and the stub broker has none, so the events worker idles here.
      smoke_env: |
        BDH_GO2RTC_URL=http://127.0.0.1:1984
      smoke_settle: 20